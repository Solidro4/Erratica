[project]
name = "erratica"
version = "0.5.0"
description = "A learning loop for local LLMs: replay failures, validate fixes on held-out cases, and promote only what measurably helps."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kevin Maqueda", email = "maquedakevin1180@gmail.com" },
]
keywords = [
    "llm",
    "local-ai",
    "continual-learning",
    "self-improvement",
    "evaluation",
    "fine-tuning",
    "feedback-loop",
    "llama-cpp",
    "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.2"]
embeddings = ["sentence-transformers>=2.2"]

[project.scripts]
erratica = "erratica.cli.main:main"

[project.urls]
Homepage = "https://github.com/Solidro4/Erratica"
Issues = "https://github.com/Solidro4/Erratica/issues"
Changelog = "https://github.com/Solidro4/Erratica/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["erratica*"]

[tool.setuptools.package-data]
erratica = ["data/*.json"]
